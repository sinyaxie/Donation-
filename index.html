<style>
:root{
  --bg:#f0efeb; --card:#ffffff; --navy:#1d2b6b; --navy-2:#2b3c8c; --lime:#c9d82a;
  --ink:#16193a; --muted:#5d6280; --line:#e2e1da; --ok:#1f8a4c;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--ink); min-height:100vh;
  display:flex; justify-content:center; padding:24px 16px 40px;
}
.wrap{width:100%;max-width:460px}
.hero{text-align:center;margin-bottom:18px}
.logo{width:150px;height:150px;border-radius:28px;display:block;margin:0 auto 10px;box-shadow:0 8px 24px rgba(29,43,107,.14)}
.tag{display:inline-block;font-size:11px;letter-spacing:.14em;font-weight:700;color:var(--navy);background:rgba(201,216,42,.45);padding:5px 12px;border-radius:99px;margin-bottom:10px}
h1{font-size:28px;line-height:1.15;color:var(--navy)}
.lead{margin-top:10px;color:var(--muted);font-size:15px;line-height:1.55}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:14px;box-shadow:0 2px 10px rgba(22,25,58,.04)}
.card h2{font-size:15px;color:var(--navy);margin-bottom:12px}
.pay{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;background:#fafaf7}
.pay:last-child{margin-bottom:0}
.net{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;color:var(--navy)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--lime);border:2px solid var(--navy)}
.num{font-size:26px;font-weight:800;letter-spacing:.04em;margin:8px 0 2px;color:var(--ink);word-break:break-all}
.lbl{font-size:12px;color:var(--muted)}
.name{font-size:15px;font-weight:600;margin-bottom:12px}
button,.btn{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 14px;font-weight:700;font-size:14px;width:100%;transition:transform .05s,opacity .2s}
